name: TER publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. 1.5.0 or v1.8.0)'
        required: true

jobs:
  ter-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install tailor
        run: composer global require typo3/tailor --no-progress --no-interaction
      - name: Publish to TER
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Prefer the GitHub release notes as TER upload comment, then the
          # tag annotation; the generic release line is only a fallback
          NOTES="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          if [ -z "$NOTES" ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          COMMENT="${NOTES:-Release $VERSION}"
          COMMENT="$COMMENT — https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          TAILOR="$(composer global config home)/vendor/bin/tailor"
          "$TAILOR" set-version "$VERSION"
          "$TAILOR" ter:publish "$VERSION" typo3_hyphenator --comment "$COMMENT"
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
